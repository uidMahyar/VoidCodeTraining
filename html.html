<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Code — HTML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-lang="html">
<div class="app">

  <div class="topbar">
    <div class="brand">
      <button class="home-btn" onclick="location.href='index.html'" title="بازگشت به صفحه اصلی" aria-label="بازگشت به صفحه اصلی">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 11.5L12 4l8 7.5" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <svg width="26" height="20" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="16" r="2.5" stroke="#e8a33d" stroke-width="2"/>
        <circle cx="28" cy="16" r="2.5" stroke="#e8a33d" stroke-width="2"/>
        <line x1="6.5" y1="16" x2="14" y2="16" stroke="#e8a33d" stroke-width="2"/>
        <line x1="22" y1="16" x2="25.5" y2="16" stroke="#e8a33d" stroke-width="2"/>
        <line x1="14" y1="16" x2="24" y2="6" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Void Code</h1>
    </div>
    <div class="actions">
      <button class="cancel-btn" id="cancelBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        لغو اجرا
      </button>
      <button class="run-btn" id="runBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        اجرا
      </button>
    </div>
  </div>

  <div class="layout">
    <div class="workspace">

      <div class="editor-region">
        <div class="editor-pane active" id="pane-code">
          <textarea class="code-input" id="editor-code" spellcheck="false">&lt;h1&gt;سلام دنیا!&lt;/h1&gt;
&lt;p&gt;این یک متن نمونه‌ست.&lt;/p&gt;
&lt;button onclick="sayHi()"&gt;کلیک کن&lt;/button&gt;</textarea>
        </div>
      </div>

      <div class="divider" id="divider">
        <button class="resize-step-btn" id="growOutputBtn" type="button" title="بزرگ‌تر کردن نمایشگر" aria-label="بزرگ‌تر کردن نمایشگر">▲</button>
        <div class="divider-hit" id="dividerHit"></div>
        <button class="resize-step-btn" id="shrinkOutputBtn" type="button" title="بزرگ‌تر کردن ادیتور" aria-label="بزرگ‌تر کردن ادیتور">▼</button>
      </div>

      <div class="output-region">
        <div class="output-header">
          <span class="status-label" id="statusLabel">
            <span class="dot" id="dot-status"></span> آماده — هنوز اجرا نشده
          </span>
          <button class="icon-btn" id="openWindowBtn" disabled>باز کردن در پنجره جدید</button>
        </div>
        <div class="output-body">
          <div class="placeholder" id="placeholder"></div>
          <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
          <div class="console-box" id="consoleBox"></div>
          <div class="error-list" id="errorList"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
