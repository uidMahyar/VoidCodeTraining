<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدار کد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <svg width="26" height="20" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="16" r="2.5" stroke="#e8a33d" stroke-width="2"/>
        <circle cx="28" cy="16" r="2.5" stroke="#e8a33d" stroke-width="2"/>
        <line x1="6.5" y1="16" x2="14" y2="16" stroke="#e8a33d" stroke-width="2"/>
        <line x1="22" y1="16" x2="25.5" y2="16" stroke="#e8a33d" stroke-width="2"/>
        <line x1="14" y1="16" x2="24" y2="6" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>مدار کد</h1>
    </div>
    <div class="actions">
      <button class="cancel-btn" id="cancelBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        لغو اجرا
      </button>
      <button class="format-btn" id="formatBtn" title="مرتب کردن کد">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="17" y2="18"/></svg>
        مرتب‌سازی
      </button>
      <button class="run-btn" id="runBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        اجرا
      </button>
    </div>
  </div>

  <div class="layout">

    <div class="rail" id="rail">
      <button class="rail-tab active" data-lang="html">
        <span class="dot" id="dot-html"></span> HTML
      </button>
      <button class="rail-tab" data-lang="css">
        <span class="dot" id="dot-css"></span> CSS
      </button>
      <button class="rail-tab" data-lang="js">
        <span class="dot" id="dot-js"></span> JavaScript
      </button>
      <button class="rail-tab" data-lang="python">
        <span class="dot" id="dot-python"></span> Python
      </button>
      <p class="rail-note">کلمات کلیدی و علائم نگارشی رنگی هستن. با «مرتب‌سازی» تورفتگی کد اصلاح می‌شه. بالای پنل خروجی رو بکش (یا ▲▼ رو بزن) تا فاصله عوض بشه.</p>
    </div>

    <div class="workspace">

      <div class="editor-region">
        <div class="editor-pane active" id="pane-html">
          <div class="editor-wrap">
            <div class="line-numbers" id="ln-html"></div>
            <div class="code-editor" id="editor-html"></div>
          </div>
        </div>

        <div class="editor-pane" id="pane-css">
          <div class="editor-wrap">
            <div class="line-numbers" id="ln-css"></div>
            <div class="code-editor" id="editor-css"></div>
          </div>
        </div>

        <div class="editor-pane" id="pane-js">
          <div class="editor-wrap">
            <div class="line-numbers" id="ln-js"></div>
            <div class="code-editor" id="editor-js"></div>
          </div>
        </div>

        <div class="editor-pane" id="pane-python">
          <div class="editor-wrap">
            <div class="line-numbers" id="ln-python"></div>
            <div class="code-editor" id="editor-python"></div>
          </div>
        </div>
      </div>

      <div class="divider" id="divider">
        <button class="resize-step-btn" id="growOutputBtn" type="button" title="بزرگ‌تر کردن نمایشگر" aria-label="بزرگ‌تر کردن نمایشگر">▲</button>
        <div class="divider-hit" id="dividerHit"></div>
        <button class="resize-step-btn" id="shrinkOutputBtn" type="button" title="بزرگ‌تر کردن ادیتور" aria-label="بزرگ‌تر کردن ادیتور">▼</button>
      </div>

      <div class="output-region">
        <div class="output-header">
          <span class="status-label" id="statusLabel">
            <span class="dot" id="dot-status"></span> آماده — هنوز اجرا نشده
          </span>
          <button class="icon-btn" id="openWindowBtn" disabled>باز کردن در پنجره جدید</button>
        </div>
        <div class="output-body">
          <div class="placeholder" id="placeholder"></div>
          <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
          <div class="console-box" id="consoleBox"></div>
          <div class="error-list" id="errorList"></div>
        </div>
      </div>

    </div>

  </div>

</div>

<script src="editor.js"></script>
<script src="script.js"></script>
</body>
</html>
